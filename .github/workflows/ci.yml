name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Security scan (npm audit)
        run: npm audit --audit-level=high

      - name: Test
        run: npm test

      - name: Build installer
        run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: machinist-calc-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
          retention-days: 14

  # Runs only on a v* tag push. Rebuilds per-OS (rather than reusing the
  # build job's artifacts) because electron-builder only generates the
  # latest.yml/latest-mac.yml/latest-linux.yml files electron-updater needs
  # when it's actually doing a publish (--publish never, used by the build
  # job above, skips generating them entirely — not just uploading them).
  # This is electron-builder's own documented GitHub Actions release
  # pattern; the contents: write permission is scoped to this tag-only job.
  release:
    name: Publish release (${{ matrix.os }})
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      # electron-builder reads the release version from package.json, not the tag name, and silently
      # skips publishing if that version's release already exists -- CI shows green with nothing
      # published. Deriving it from the tag here means a forgotten/mismatched manual version bump in
      # package.json can no longer cause that; env: + a shell variable, not inline ${{ }}, per this
      # repo's GitHub Actions Security rule on untrusted/attacker-influenceable context values.
      - name: Sync package.json version with the tag
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: npm version "${TAG_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Build and publish installer
        run: npx electron-builder --publish always
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ github.token }}
